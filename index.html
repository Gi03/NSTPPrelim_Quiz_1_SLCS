<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSTP Recall Quiz — Person, Values, Leadership & Group Dynamics</title>
<style>
  :root{
    --navy: #14304D;
    --navy-deep: #0B1F33;
    --gold: #B8862E;
    --gold-light: #E4C878;
    --paper: #FFFFFF;
    --ink: #1B2430;
    --ink-soft: #5B6472;
    --line: #E3E7EC;
    --red: #A5342A;
    --green: #2E6B4F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--navy-deep);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(228,200,120,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(228,200,120,0.05), transparent 45%);
    font-family: "Iowan Old Style","Georgia", "Times New Roman", serif;
    color: var(--ink);
    min-height: 100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: 32px 16px 64px;
  }
  .sans{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

  .app{
    width:100%;
    max-width: 640px;
  }

  .masthead{
    text-align:center;
    color: var(--gold-light);
    margin-bottom: 22px;
  }
  .masthead .logo{
    width: 84px;
    height: 84px;
    margin-bottom: 12px;
    filter: drop-shadow(0 4px 14px rgba(0,0,0,0.35));
  }
  .masthead .eyebrow{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 11px;
    color: rgba(228,200,120,0.75);
    margin-bottom: 6px;
  }
  .masthead h1{
    font-size: 26px;
    margin: 0;
    font-weight: 600;
    color: #F5EFE0;
    line-height:1.3;
  }

  .card{
    background: var(--paper);
    border-radius: 4px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
    overflow:hidden;
  }

  /* progress rail */
  .rail{
    height: 5px;
    background: var(--line);
    position:relative;
  }
  .rail-fill{
    height:100%;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    transition: width 0.35s ease;
  }

  .panel{ padding: 34px 32px 30px; }

  .step-label{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 10px;
  }

  h2.qtext{
    font-size: 21px;
    line-height: 1.4;
    margin: 0 0 22px;
    font-weight: 600;
    color: var(--navy-deep);
  }

  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display:flex;
    align-items:center;
    gap:12px;
    padding: 13px 16px;
    border: 1.5px solid var(--line);
    border-radius: 3px;
    cursor:pointer;
    background: #FDFDFC;
    transition: border-color 0.15s, background 0.15s;
    font-size: 15px;
    color: var(--ink);
  }
  .opt:hover{ border-color: var(--gold); background: #FBF6EA; }
  .opt.selected{ border-color: var(--gold); background: #FBF3DD; }
  .opt .letter{
    flex:0 0 auto;
    width:26px; height:26px;
    border-radius:50%;
    border: 1.5px solid var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    font-size: 12px; font-weight:700; color: var(--ink-soft);
  }
  .opt.selected .letter{ background: var(--gold); border-color: var(--gold); color: #fff; }

  .nav-row{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-top: 28px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  button{
    font-family: inherit;
    cursor:pointer;
    border:none;
    border-radius: 3px;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 22px;
  }
  .btn-ghost{
    background: transparent;
    color: var(--ink-soft);
  }
  .btn-ghost:disabled{ opacity:0.35; cursor:default; }
  .btn-primary{
    background: var(--navy);
    color: #F5EFE0;
    letter-spacing: 0.02em;
  }
  .btn-primary:disabled{ background:#C9CDD3; color:#8a8f97; cursor:not-allowed; }
  .btn-primary:not(:disabled):hover{ background: var(--navy-deep); }

  .counter{
    font-size: 13px;
    color: var(--ink-soft);
  }

  /* intro screen */
  .field{ margin-bottom: 16px; }
  .field label{
    display:block;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 6px;
    font-weight:700;
  }
  .field input, .field select{
    width:100%;
    padding: 11px 13px;
    border: 1.5px solid var(--line);
    border-radius: 3px;
    font-size: 15px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
  }
  .field input:focus, .field select:focus{ outline: none; border-color: var(--gold); }
  .intro-lede{
    color: var(--ink-soft);
    font-size: 15px;
    line-height: 1.6;
    margin: 0 0 26px;
  }

  /* results */
  .result-hero{ text-align:center; padding: 10px 0 8px; }
  .result-score{
    font-size: 54px;
    font-weight: 700;
    color: var(--navy);
    line-height:1;
  }
  .result-of{ color: var(--ink-soft); font-size:14px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; margin-top:4px;}
  .review{
    margin-top: 26px;
    display:flex;
    flex-direction:column;
    gap: 14px;
  }
  .review-item{
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .review-item .q{ font-weight:600; font-size:14px; color: var(--navy-deep); margin-bottom:6px; }
  .review-item .a{ font-size: 13px; color: var(--ink-soft); }
  .review-item.correct{ border-left: 4px solid var(--green); }
  .review-item.wrong{ border-left: 4px solid var(--red); }
  .tag{
    display:inline-block;
    font-size: 11px;
    font-weight:700;
    padding: 2px 8px;
    border-radius: 20px;
    margin-left: 8px;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .tag.correct{ background: #E4F1EA; color: var(--green); }
  .tag.wrong{ background: #F5E3E1; color: var(--red); }

  .status-line{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 13px;
    text-align:center;
    margin-top: 18px;
    color: var(--ink-soft);
  }
  .status-line.error{ color: var(--red); }
  .status-line.ok{ color: var(--green); }

  .footer-note{
    text-align:center;
    color: rgba(245,239,224,0.55);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 12px;
    margin-top: 22px;
    line-height:1.6;
  }

  .copyright{
    text-align:center;
    color: rgba(245,239,224,0.35);
    font-size: 11px;
    line-height: 1.6;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(245,239,224,0.12);
  }

  @media (max-width:480px){
    .panel{ padding: 26px 20px 24px; }
    h2.qtext{ font-size:18px; }
    .result-score{ font-size:44px; }
  }
</style>
</head>

<script>
/* ---------------- CONFIGURATION ---------------- */
// Paste the Web App URL you get from deploying the Apps Script (see setup guide).
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw1qhRPJyd3oibj7y1uhraSzqYaTE8wATjvyPh8TEcfG-oWwC13ZSAP8Qgi4s6yHo9E/exec";
/* ------------------------------------------------ */

const QUESTIONS = [
  {id:"q1", prompt:"What law governs the National Service Training Program (NSTP)?", options:[["a","RA 7160"],["b","RA 9163"],["c","RA 10175"],["d","RA 9262"]], correct:"b"},
  {id:"q2", prompt:"What does CWTS stand for?", options:[["a","Community Work and Training System"],["b","Citizen Welfare and Teamwork Service"],["c","Civic Work Training Society"],["d","Civic Welfare Training Service"]], correct:"d"},
  {id:"q3", prompt:"Which characteristic of a human person reflects 'a unity of body and soul'?", options:[["a","Embodied Spirit"],["b","Rational"],["c","Social by Nature"],["d","Open to Growth"]], correct:"a"},
  {id:"q4", prompt:"In the Biblical view of the human person, what term describes humans being created in the image of God?", options:[["a","Kenosis"],["b","Theosis"],["c","Imago Dei"],["d","Logos"]], correct:"c"},
  {id:"q5", prompt:"Which philosopher is associated with the statement 'Man is a rational animal'?", options:[["a","Plato"],["b","Aristotle"],["c","Descartes"],["d","Sartre"]], correct:"b"},
  {id:"q6", prompt:"Which philosophical view holds that 'existence precedes essence'?", options:[["a","Dualism (Plato)"],["b","Rational Animal (Aristotle)"],["c","Cartesian Dualism"],["d","Existentialism"]], correct:"d"},
  {id:"q7", prompt:"In the Philippine Bill of Rights, which section is described as the 'umbrella clause' underlying most other rights?", options:[["a","Due Process & Equal Protection"],["b","Freedom of Expression"],["c","Freedom of Religion"],["d","Liberty of Abode & Travel"]], correct:"a"},
  {id:"q8", prompt:"In Maslow's Hierarchy of Needs, which level sits at the very base of the pyramid?", options:[["a","Safety Needs"],["b","Love & Belonging"],["c","Physiological Needs"],["d","Esteem"]], correct:"c"},
  {id:"q9", prompt:"What branch of philosophy studies the nature, types, and criteria of value?", options:[["a","Epistemology"],["b","Axiology"],["c","Ontology"],["d","Metaphysics"]], correct:"b"},
  {id:"q10", prompt:"Which Filipino value refers to a 'debt of gratitude' or deep sense of reciprocity for kindness received?", options:[["a","Pakikisama"],["b","Hiya"],["c","Bayanihan"],["d","Utang na Loob"]], correct:"d"},
  {id:"q11", prompt:"Which leadership style is built on structured exchanges, clear roles, and rewards or corrective action based on performance?", options:[["a","Transactional Leadership"],["b","Transformational Leadership"],["c","Laissez-faire Leadership"],["d","Servant Leadership"]], correct:"a"},
  {id:"q12", prompt:"According to Bass & Avolio's model, which of the 'Four I's' involves the leader acting as a role model who earns trust through ethical behavior?", options:[["a","Inspirational Motivation"],["b","Intellectual Stimulation"],["c","Idealized Influence"],["d","Individualized Consideration"]], correct:"c"},
  {id:"q13", prompt:"In Tuckman's Model of Group Development, what stage comes right after 'Forming'?", options:[["a","Norming"],["b","Storming"],["c","Performing"],["d","Adjourning"]], correct:"b"},
  {id:"q14", prompt:"Which element of a group is described as 'the defining feature that separates a group from a mere crowd'?", options:[["a","Common Goal"],["b","Norms"],["c","Cohesion"],["d","Interaction"]], correct:"d"},
  {id:"q15", prompt:"How many modules make up this NSTP session (excluding the opening, break, and closing)?", options:[["a","4"],["b","3"],["c","5"],["d","6"]], correct:"a"}
];

const TOTAL_STEPS = QUESTIONS.length + 1; // +1 for intro
const STEP_CHECKING = "checking";
const STEP_BLOCKED = "blocked";
const STEP_CHECK_ERROR = "check_error";
let step = 0; // 0 = intro, "checking", "blocked", "check_error", 1..15 = questions, 16 = results
let student = { name: "", idnum: "", section: "" };
let answers = {}; // qid -> optionId
let submitted = false;
let lastCheckError = "";

const panel = document.getElementById("panel");
const railFill = document.getElementById("railFill");
const footerNote = document.getElementById("footerNote");

function updateRail(){
  let pct = 0;
  if(step === 0 || step === STEP_CHECKING) pct = 2;
  else if(step === STEP_BLOCKED || step === STEP_CHECK_ERROR) pct = 100;
  else if(typeof step === "number" && step <= QUESTIONS.length) pct = (step / (QUESTIONS.length + 1)) * 100;
  else pct = 100;
  railFill.style.width = pct + "%";
}

function renderIntro(){
  panel.innerHTML = `
    <div class="step-label">Before you begin</div>
    <h2 class="qtext">Quick recall check</h2>
    <p class="intro-lede">15 questions on Person, Values, Leadership, and Group Dynamics. Enter your details so your instructor can record your score. Each Student ID may take this quiz only once.</p>
    <div class="field">
      <label class="sans">Full name</label>
      <input type="text" id="inpName" placeholder="Juan Dela Cruz" value="${escapeAttr(student.name)}">
    </div>
    <div class="field">
      <label class="sans">Student ID</label>
      <input type="text" id="inpId" placeholder="2023-00123" value="${escapeAttr(student.idnum)}">
    </div>
    <div class="field">
      <label class="sans">Section / Class</label>
      <input type="text" id="inpSection" placeholder="BSCS 1-A" value="${escapeAttr(student.section)}">
    </div>
    <div class="nav-row">
      <span></span>
      <button class="btn-primary" id="startBtn">Start quiz</button>
    </div>
    <div class="status-line sans" id="introStatus" style="display:none;"></div>
  `;
  document.getElementById("startBtn").onclick = () => {
    student.name = document.getElementById("inpName").value.trim();
    student.idnum = document.getElementById("inpId").value.trim();
    student.section = document.getElementById("inpSection").value.trim();
    if(!student.name){
      flashRequired("inpName");
      return;
    }
    if(!student.idnum){
      flashRequired("inpId");
      return;
    }
    step = STEP_CHECKING;
    render();
    checkIfAlreadyTaken();
  };
}

function flashRequired(id){
  const el = document.getElementById(id);
  el.style.borderColor = "var(--red)";
  el.focus();
}

function renderChecking(){
  panel.innerHTML = `
    <div class="step-label">One moment</div>
    <h2 class="qtext">Checking your Student ID…</h2>
    <p class="intro-lede">Making sure this ID hasn't already submitted the quiz.</p>
  `;
}

function renderBlocked(){
  panel.innerHTML = `
    <div class="step-label">Already recorded</div>
    <h2 class="qtext">This Student ID has already taken the quiz.</h2>
    <p class="intro-lede">A submission for <strong>${escapeAttr(student.idnum)}</strong> is already on the class roster. If you believe this is a mistake, contact your instructor.</p>
    <div class="nav-row">
      <button class="btn-ghost" id="backToIntro">Return to Home</button>
      <span></span>
    </div>
  `;
  document.getElementById("backToIntro").onclick = () => {
    step = 0;
    render();
  };
}

function renderCheckError(){
  panel.innerHTML = `
    <div class="step-label">Couldn't verify</div>
    <h2 class="qtext">We couldn't check whether this ID already took the quiz.</h2>
    <p class="intro-lede">This usually means the quiz isn't connected to the answer sheet yet, or the sheet is temporarily unreachable. Please try again, or let your instructor know if this keeps happening.</p>
    ${lastCheckError ? `<p class="intro-lede" style="font-family:-apple-system,sans-serif;font-size:12px;color:var(--red);background:#F9EEEC;border-radius:4px;padding:10px 12px;">Details: ${escapeAttr(lastCheckError)}</p>` : ""}
    <div class="nav-row">
      <button class="btn-ghost" id="backToIntro2">Back</button>
      <button class="btn-primary" id="retryCheck">Try again</button>
    </div>
  `;
  document.getElementById("backToIntro2").onclick = () => { step = 0; render(); };
  document.getElementById("retryCheck").onclick = () => {
    step = STEP_CHECKING;
    render();
    checkIfAlreadyTaken();
  };
}

// JSONP call to the Apps Script backend to check if idnum already submitted.
function checkIfAlreadyTaken(){
  if(!SCRIPT_URL || SCRIPT_URL.indexOf("PASTE_YOUR") === 0){
    lastCheckError = "SCRIPT_URL is still the placeholder — paste your Apps Script Web app URL into index.html.";
    step = STEP_CHECK_ERROR;
    render();
    return;
  }

  const callbackName = "nstpCheckCb_" + Date.now();
  let settled = false;

  const cleanup = (script) => {
    delete window[callbackName];
    if(script && script.parentNode) script.parentNode.removeChild(script);
  };

  window[callbackName] = (result) => {
    if(settled) return;
    settled = true;
    cleanup(script);
    if(result && result.ok === false){
      lastCheckError = result.error || "The script returned an error.";
      step = STEP_CHECK_ERROR;
    } else if(result && result.taken){
      step = STEP_BLOCKED;
    } else {
      step = 1;
    }
    render();
  };

  const script = document.createElement("script");
  script.src = SCRIPT_URL + "?idnum=" + encodeURIComponent(student.idnum) + "&callback=" + callbackName;
  script.onerror = () => {
    if(settled) return;
    settled = true;
    cleanup(script);
    lastCheckError = "The script tag failed to load — check the SCRIPT_URL is correct and the deployment is set to \"Anyone\" access.";
    step = STEP_CHECK_ERROR;
    render();
  };
  document.body.appendChild(script);

  // Safety timeout in case the request hangs or the callback never fires
  // (e.g. deployment doesn't have doGet yet, or access isn't set to "Anyone").
  setTimeout(() => {
    if(settled) return;
    settled = true;
    cleanup(script);
    lastCheckError = "No response after 6 seconds — the deployment likely needs to be redeployed as a new version after editing the script.";
    step = STEP_CHECK_ERROR;
    render();
  }, 6000);
}

function renderQuestion(){
  const q = QUESTIONS[step - 1];
  const selected = answers[q.id];
  panel.innerHTML = `
    <div class="step-label">Question ${step} of ${QUESTIONS.length}</div>
    <h2 class="qtext">${q.prompt}</h2>
    <div class="options" id="optWrap">
      ${q.options.map(([oid, text]) => `
        <div class="opt ${selected === oid ? 'selected' : ''}" data-oid="${oid}">
          <span class="letter">${oid.toUpperCase()}</span>
          <span>${text}</span>
        </div>
      `).join("")}
    </div>
    <div class="nav-row">
      <button class="btn-ghost" id="backBtn" ${step === 1 ? "disabled" : ""}>Back</button>
      <span class="counter sans">${Object.keys(answers).length} / ${QUESTIONS.length} answered</span>
      <button class="btn-primary" id="nextBtn" ${selected ? "" : "disabled"}>
        ${step === QUESTIONS.length ? "See results" : "Next"}
      </button>
    </div>
  `;

  document.querySelectorAll(".opt").forEach(el => {
    el.onclick = () => {
      answers[q.id] = el.getAttribute("data-oid");
      renderQuestion();
    };
  });

  document.getElementById("backBtn").onclick = () => { step -= 1; render(); };
  document.getElementById("nextBtn").onclick = () => {
    if(step === QUESTIONS.length){
      step = QUESTIONS.length + 1;
      submitResults();
    } else {
      step += 1;
    }
    render();
  };
}

function scoreQuiz(){
  let correctCount = 0;
  QUESTIONS.forEach(q => { if(answers[q.id] === q.correct) correctCount++; });
  return correctCount;
}

function renderResults(){
  const score = scoreQuiz();
  panel.innerHTML = `
    <div class="step-label">Complete</div>
    <div class="result-hero">
      <div class="result-score">${score}<span style="font-size:26px;color:var(--ink-soft);"> / ${QUESTIONS.length}</span></div>
      <div class="result-of sans">${student.name}${student.section ? " · " + student.section : ""}</div>
    </div>
    <div id="statusLine" class="status-line sans">Submitting your answers…</div>
    <div class="review" id="reviewList">
      ${QUESTIONS.map((q,i) => {
        const chosen = answers[q.id];
        const isCorrect = chosen === q.correct;
        const chosenText = q.options.find(o => o[0] === chosen)?.[1] || "—";
        const correctText = q.options.find(o => o[0] === q.correct)?.[1];
        return `
          <div class="review-item ${isCorrect ? 'correct' : 'wrong'}">
            <div class="q">${i+1}. ${q.prompt} <span class="tag ${isCorrect ? 'correct' : 'wrong'}">${isCorrect ? 'Correct' : 'Missed'}</span></div>
            <div class="a">Your answer: ${chosenText}${isCorrect ? '' : ' · Correct answer: ' + correctText}</div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function render(){
  updateRail();
  if(step === 0) renderIntro();
  else if(step === STEP_CHECKING) renderChecking();
  else if(step === STEP_BLOCKED) renderBlocked();
  else if(step === STEP_CHECK_ERROR) renderCheckError();
  else if(typeof step === "number" && step >= 1 && step <= QUESTIONS.length) renderQuestion();
  else renderResults();
}

function escapeAttr(s){
  return (s || "").replace(/"/g,"&quot;");
}

async function submitResults(){
  const score = scoreQuiz();
  const statusEl = () => document.getElementById("statusLine");

  if(!SCRIPT_URL || SCRIPT_URL.indexOf("PASTE_YOUR") === 0){
    setTimeout(() => {
      const el = statusEl();
      if(el){
        el.textContent = "No Google Sheet is connected yet — this run wasn't saved. (See setup guide.)";
        el.classList.add("error");
      }
    }, 300);
    return;
  }

  const payload = {
    timestamp: new Date().toISOString(),
    name: student.name,
    idnum: student.idnum,
    section: student.section,
    score: score,
    total: QUESTIONS.length,
    answers: answers
  };

  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors", // Apps Script web apps don't return CORS headers; response is opaque
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    submitted = true;
    const el = statusEl();
    if(el){
      el.textContent = "Saved to the class roster. You're done!";
      el.classList.add("ok");
    }
  } catch (err) {
    const el = statusEl();
    if(el){
      el.textContent = "Couldn't reach the sheet — check your connection and try refreshing.";
      el.classList.add("error");
    }
  }
}

render();
</script>
